name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read versions
        id: ver
        run: |
          echo "pack=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          echo "dsh=$(tr -d '[:space:]' < dsh-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            DSH_VERSION=${{ steps.ver.outputs.dsh }}
            DSH_IMAGE_VERSION=${{ steps.ver.outputs.pack }}
            DSH_GIT_REV=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/dsh-docker:${{ steps.ver.outputs.pack }}-dsh${{ steps.ver.outputs.dsh }}
            ghcr.io/${{ github.repository_owner }}/dsh-docker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
